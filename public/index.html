<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ghafoon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ghafoon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="home" class="screen">
    <div class="home-card">
      <div class="card-top"><div class="lang-switch" data-lang-switch></div><button class="gear" data-i18n-aria="set.title" data-i18n-title="set.title" aria-label="Settings">⚙</button></div>
      <h1 dir="ltr"><span class="suit">♠</span> <span dir="ltr">Ghafoon</span> <span class="suit red">♥</span></h1>
      <p class="tag" data-i18n="home.tag">Four players, two teams, 104 points. Empty seats are played by bots.</p>
      <label><span data-i18n="home.name">Your name</span> <input id="name" maxlength="14" data-i18n-ph="home.namePh" placeholder="Pick a name" autocomplete="nickname"></label>
      <button id="btn-solo" class="primary" data-i18n="home.solo">Quick play vs 3 bots</button>
      <button id="btn-create" data-i18n="home.create">Create a room for friends</button>
      <div class="join-row">
        <input id="code" maxlength="4" data-i18n-ph="home.codePh" placeholder="CODE" autocapitalize="characters" spellcheck="false" dir="ltr">
        <button id="btn-join" data-i18n="home.join">Join room</button>
      </div>
      <p id="home-msg" class="msg"></p>
    </div>
  </section>

  <section id="lobby" class="screen hidden">
    <div class="home-card wide">
      <div class="card-top"><div class="lang-switch" data-lang-switch></div><button class="gear" data-i18n-aria="set.title" data-i18n-title="set.title" aria-label="Settings">⚙</button></div>
      <div class="lobby-head"><h2><span data-i18n="lobby.room">Room</span> <span id="lobby-code" class="code" dir="ltr"></span></h2><button class="chat-btn" data-i18n-aria="chat.open" aria-label="Open chat"><span data-i18n="lobby.chat">💬 Chat</span><span class="badge-n hidden"></span></button></div>
      <p class="tag" data-i18n="lobby.help"></p>
      <div class="share"><input id="share-link" readonly dir="ltr"><button id="btn-copy" data-i18n="lobby.copy">Copy link</button></div>
      <label><span data-i18n="lobby.yourName">Your name</span> <input id="lobby-name" maxlength="14" autocomplete="nickname"></label>
      <div id="lobby-seats" class="lobby-table"></div>
      <div class="row">
        <button id="btn-start" class="primary" data-i18n="lobby.start">Start game</button>
        <button id="btn-leave-lobby" data-i18n="lobby.leave">Leave</button>
      </div>
      <p id="lobby-msg" class="msg"></p>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <header class="topbar">
      <div class="room-tag"><span data-i18n="game.room">Room</span> <b id="g-code" dir="ltr"></b></div>
      <div class="scoreboard" id="scoreboard"></div>
      <div class="top-actions">
        <div class="lang-switch" data-lang-switch></div>
        <button class="gear small" data-i18n-aria="set.title" data-i18n-title="set.title" aria-label="Settings">⚙</button>
        <button class="chat-btn small" data-i18n-aria="chat.open" aria-label="Open chat">💬<span class="badge-n hidden"></span></button>
        <button id="btn-leave" class="small" data-i18n="game.leave">Leave</button>
      </div>
    </header>
    <div class="table" id="table">
      <div class="trow" id="trow"></div>
      <div class="mrow" id="mrow">
        <div class="side" id="seat-left"></div>
        <div class="center" id="center"></div>
        <div class="side" id="seat-right"></div>
      </div>
      <div class="mine" id="mine">
        <div class="status" id="status"></div>
        <div class="actions" id="actions"></div>
        <div class="hand" id="hand"></div>
        <div class="me-seat" id="seat-me"></div>
      </div>
      <div class="info" id="info"></div>
      <div class="last" id="last"></div>
      <div class="banner hidden" id="banner"></div>
    </div>
  </section>
</main>
<aside id="chat" class="chat hidden" data-i18n-aria="chat.title" aria-label="Chat">
  <header><b data-i18n="chat.title">Chat</b><button id="chat-close" class="small" data-i18n-aria="chat.close" aria-label="Close chat">×</button></header>
  <div id="chat-log" class="chat-log"></div>
  <div id="chat-quick" class="chat-quick"></div>
  <form id="chat-form" autocomplete="off"><input id="chat-input" maxlength="200" data-i18n-ph="chat.ph" placeholder="Say something…" enterkeyhint="send"><button class="primary" type="submit" data-i18n="chat.send">Send</button></form>
</aside>
<div id="settings" class="settings hidden" role="dialog" data-i18n-aria="set.title" aria-label="Settings">
  <div class="settings-head"><b data-i18n="set.title">Settings</b><button id="settings-close" class="small" data-i18n-aria="set.close" aria-label="Close">×</button></div>
  <div class="settings-row"><span data-i18n="set.language">Language</span><div class="lang-switch" data-lang-switch></div></div>
  <label class="settings-row check"><input type="checkbox" id="set-faces"><span data-i18n="set.cards">Persian card names</span></label>
</div>
<div id="overlay" class="overlay hidden"></div>
<div id="toast" class="toast hidden"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
