<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghafoon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="home" class="screen">
    <div class="home-card">
      <h1><span class="suit">♠</span> Ghafoon <span class="suit red">♥</span></h1>
      <p class="tag">Four players, two teams, 104 points. Empty seats are played by bots.</p>
      <label>Your name <input id="name" maxlength="14" placeholder="Name" autocomplete="nickname"></label>
      <button id="btn-solo" class="primary">Quick play vs 3 bots</button>
      <button id="btn-create">Create a room for friends</button>
      <div class="join-row">
        <input id="code" maxlength="4" placeholder="CODE" autocapitalize="characters" spellcheck="false">
        <button id="btn-join">Join room</button>
      </div>
      <p id="home-msg" class="msg"></p>
    </div>
  </section>

  <section id="lobby" class="screen hidden">
    <div class="home-card wide">
      <h2>Room <span id="lobby-code" class="code"></span></h2>
      <p class="tag">Share the link. Click an empty seat to move. Partners sit opposite each other. Empty seats will be played by bots.</p>
      <div class="share"><input id="share-link" readonly><button id="btn-copy">Copy link</button></div>
      <div id="lobby-seats" class="lobby-seats"></div>
      <div class="row">
        <button id="btn-start" class="primary">Start game</button>
        <button id="btn-leave-lobby">Leave</button>
      </div>
      <p id="lobby-msg" class="msg"></p>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <header class="topbar">
      <div class="room-tag">Room <b id="g-code"></b></div>
      <div class="scoreboard" id="scoreboard"></div>
      <button id="btn-leave" class="small">Leave</button>
    </header>
    <div class="table" id="table"></div>
    <div class="status" id="status"></div>
    <div class="actions" id="actions"></div>
    <div class="hand" id="hand"></div>
  </section>
</main>
<div id="overlay" class="overlay hidden"></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
